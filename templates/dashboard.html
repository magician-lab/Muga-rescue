<!DOCTYPE html>
<html>
<head>
    <title>Muga Rescue Dashboard</title>
</head>
<body style="font-family:Arial; background:#f4f6f9; padding:40px;">

<h1 style="color:#1f4f99;">Muga Rescue - Tigania West</h1>
<p style="font-size:18px; font-weight:bold; color:darkred;">
    Register to suggest a project
</p>

<!-- STATISTICS -->
<div style="display:flex; gap:20px; margin-top:20px;">

<div style="background:white; padding:20px; width:200px; border-radius:8px;">
<h3>Total Registered</h3>
<p style="font-size:24px;">{{ total_users }}</p>
</div>

<div style="background:white; padding:20px; width:200px; border-radius:8px;">
<h3>Total Projects</h3>
<p style="font-size:24px;">{{ total_projects }}</p>
</div>

<div style="background:white; padding:20px; width:200px; border-radius:8px;">
<h3>Pending</h3>
<p style="font-size:24px; color:red;">{{ pending_projects }}</p>
</div>

<div style="background:white; padding:20px; width:200px; border-radius:8px;">
<h3>Approved</h3>
<p style="font-size:24px; color:green;">{{ approved_projects }}</p>
</div>

</div>

<br>

<!-- BUTTONS -->
<button onclick="window.location.href='/register'"
style="padding:12px 25px; background:#1f4f99; color:white; border:none; border-radius:5px;">
Register
</button>

<button onclick="window.location.href='/pending_projects'"
style="padding:12px 25px; background:orange; color:white; border:none; border-radius:5px;">
View Pending Projects
</button>

<button onclick="window.location.href='/approved_projects'"
style="padding:12px 25px; background:green; color:white; border:none; border-radius:5px;">
View Approved Projects
</button>
<button onclick="window.location.href='/submit_project'"
style="padding:12px 25px; background:purple; color:white; border:none; border-radius:5px;">
Submit Project
</button>

</body>
</html>
