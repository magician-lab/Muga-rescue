<!DOCTYPE html>
<html>
<head>
    <title>Muga Rescue | Citizen Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2c7be5;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1a68d1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Citizen Registration</h2>
{% if message %}
<p style="color:red; font-weight:bold;">{{ message }}</p>
{% endif %}

    <form method="POST" action="/register">
        <input type="text" name="id_number" placeholder="ID Number" required>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="phone" placeholder="Phone Number" required>
        <input type="text" name="sublocation" placeholder="Sublocation" required>
        <button type="submit">Register</button>
    </form>
    <button onclick="window.location.href='/'"
style="padding:10px 20px; background:#1f4f99; color:white; border:none;">
Back to Dashboard
</button>
</div>

</body>
</html>
