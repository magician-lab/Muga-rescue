<!DOCTYPE html>
<html>
<head>
    <title>MUGA Rescue | Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
        }
        .container {
            width: 95%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0b5ed7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #0b5ed7;
            color: white;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .btn-approve {
            padding: 10px 18px;
            background: green;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete {
            padding: 10px 18px;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .btn-approve:hover { background: darkgreen; }
        .btn-delete:hover { background: darkred; }

        .top-actions {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin - Project Management</h2>
<button onclick="window.location.href='/members'"
style="padding:12px 25px; background:green; color:white; border:none; border-radius:5px;">
registered members
</button>
    <form method="POST" action="/admin">
        <table>
            <tr>
                <th>Select</th>
                <th>Project Name</th>
                <th>Description</th>
                <th>Location</th>
                <th>Status</th>
            </tr>

            {% for project in projects %}
            <tr>
                <td>
                    <input type="checkbox" name="project_ids" value="{{ project.id }}">
                </td>
                <td>{{ project.name }}</td>
                <td>{{ project.description }}</td>
                <td>{{ project.location }}</td>
                <td>{{ project.status }}</td>
            </tr>
            {% endfor %}
        </table>

        <div class="top-actions">
            <button type="submit" name="approve_selected" class="btn-approve">
                Approve Selected
            </button>

            <button type="submit" name="delete_selected" class="btn-delete"
                    onclick="return confirm('Are you sure you want to delete the selected projects?');">
                Delete Selected
            </button>
        </div>
    </form>
</div>

</body>
</html>
