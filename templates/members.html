<!DOCTYPE html>
<html>
<head>
    <title>MUGA Rescue | Registered Members</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
        }
        .container {
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0b5ed7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #0b5ed7;
            color: white;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 18px;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background: darkred;
        }
        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #0b5ed7;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registered Members</h2>

    <form method="POST" action="/members">
        <table>
            <tr>
                <th>Select</th>
                <th>ID Number</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Sublocation</th>
            </tr>

            {% for user in users %}
            <tr>
                <td>
                    <input type="checkbox" name="delete_ids" value="{{ user.id }}">
                </td>
                <td>{{ user.national_id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.phone }}</td>
                <td>{{ user.sublocation }}</td>
            </tr>
            {% endfor %}
        </table>

        <button type="submit" class="btn">Delete Selected</button>
    </form>

    <a href="/admin" class="back-btn">Back to Admin</a>
</div>

</body>
</html>
